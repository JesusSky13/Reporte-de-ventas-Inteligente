  function parseCSVLine(str) {
    const arr = [];
    let quote = false;
    let col = '';
    for (let c = 0; c < str.length; c++) {
      const cc = str[c];
      const nc = str[c + 1];
      if (cc === '"') {
        if (quote && nc === '"') { col += '"'; c++; }
        else { quote = !quote; }
      } else if (cc === ',' && !quote) {
        arr.push(col.trim());
        col = '';
      } else {
        col += cc;
      }
    }
    arr.push(col.trim());
    return arr;
  }
